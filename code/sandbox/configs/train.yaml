run_name: mnist_ddpm
device: auto
seed: 42

model:
  in_channels: 1
  out_channels: 1
  model_channels: 64
  channel_mult: [1, 2, 4]
  num_res_blocks: 2
  attn_resolutions: [7]
  dropout: 0.0
  resamp_with_conv: true

diffusion:
  T: 200
  beta_start: 0.0001
  beta_end: 0.02

train:
  num_epochs: 5
  learning_rate: 0.0001
  checkpoint_every: 1
