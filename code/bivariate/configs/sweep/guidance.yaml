stage: calibration
output_dir: runs/sweeps/guidance
output_name: null
resume: false
calibration_results_path: null

methods: [naive_guidance, tds]
target_means: [2.0, 6.0]
target_variance: 0.25
guidance_scales: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
guidance_starts: [0.4, 0.5, 0.6, 0.7]
num_steps: 1000
batch_size: 500

calibration:
  num_samples_per_setting: 1000
  num_particles: 256
  seed: 67

confirmation:
  num_samples_per_setting: 12000
  num_particles: 2048
  seed: 68

naive:
  schedule: delayed_discrete

tds:
  twist_type: tractable
  guidance_ramp: delayed_linear
  resample_type: systematic
  adaptive_resampling: true
  ess_threshold: 0.5
  max_guidance_grad_norm: 100.0
